name: Client Android release

on:
  pull_request:
    branches: [main]
    # Drafts already run checks; becoming ready must not repeat the same head.
    types: [opened, synchronize, reopened]
    paths:
      - apps/client/**
      - contracts/fixtures/**
      - .tool-versions
      - .github/workflows/client-android-release.yml

permissions:
  contents: read

concurrency:
  group: client-android-release
  cancel-in-progress: false

jobs:
  android:
    if: github.repository == 'YouSangSon/Omni-Folio' && github.event.repository.private == false && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14.5'
      - name: Install the pinned Flutter SDK
        run: |
          grep -Fx 'flutter 3.47.1-stable' .tool-versions
          grep -Fx 'python 3.14.5' .tool-versions
          sdk="$RUNNER_TEMP/omni-flutter"
          git clone --depth 1 --branch 3.47.1 https://github.com/flutter/flutter.git "$sdk"
          test "$(git -C "$sdk" rev-parse HEAD)" = 6655482ec06e547f90abf8ae7590466f4415978d
          git -C "$sdk" switch -c stable
          echo "$sdk/bin" >> "$GITHUB_PATH"
          "$sdk/bin/flutter" --version --machine
          "$sdk/bin/flutter" precache --android
      - name: Resolve the committed lock
        working-directory: apps/client
        run: flutter pub get --enforce-lockfile
      - name: Check the affected unit and fake scenarios
        working-directory: apps/client
        run: flutter test --no-pub --concurrency=1 test/csv_file_test.dart test/vertical_slice_test.dart test/activity_pagination_test.dart
      - name: Configure the isolated Gradle budget
        run: |
          gradle_home="$RUNNER_TEMP/omni-gradle"
          mkdir "$gradle_home"
          cat > "$gradle_home/gradle.properties" <<'PROPERTIES'
          org.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=768m
          org.gradle.workers.max=1
          org.gradle.parallel=false
          org.gradle.daemon=false
          kotlin.compiler.execution.strategy=in-process
          PROPERTIES
          "$JAVA_HOME_21_X64/bin/java" -version
          echo "GRADLE_USER_HOME=$gradle_home" >> "$GITHUB_ENV"
          echo "JAVA_HOME=$JAVA_HOME_21_X64" >> "$GITHUB_ENV"
      - name: Build the ARM64 release
        working-directory: apps/client
        # --no-pub skips release-mode plugin regeneration in Flutter 3.47.1.
        run: flutter build apk --release --target-platform android-arm64 --dart-define=OMNI_API_URL=http://127.0.0.1:9
      - name: Verify package and source identity
        run: |
          git diff --exit-code -- apps/client .tool-versions
          python - <<'PY'
          import copy, hashlib, json, os, subprocess, zipfile
          import xml.etree.ElementTree as ET
          from pathlib import Path

          app = Path("apps/client")
          apk = app / "build/app/outputs/flutter-apk/app-release.apk"
          registrant = app / "android/app/src/main/java/io/flutter/plugins/GeneratedPluginRegistrant.java"
          registration = registrant.read_text()
          assert "IntegrationTestPlugin" not in registration
          assert "file_selector_android.FileSelectorAndroidPlugin" in registration
          analyzer = Path(os.environ["ANDROID_HOME"]) / "cmdline-tools/latest/bin/apkanalyzer"
          manifest = ET.fromstring(subprocess.check_output([str(analyzer), "manifest", "print", str(apk)]))
          ns = "{http://schemas.android.com/apk/res/android}"
          def verify_permissions(root):
              assert root.get("package") == "com.example.omni_folio_client"
              receiver = root.get("package") + ".DYNAMIC_RECEIVER_NOT_EXPORTED_PERMISSION"
              requests = [entry for entry in root if entry.tag.split("}")[-1].startswith("uses-permission")]
              assert all(entry.tag == "uses-permission" for entry in requests)
              permissions = [entry.get(ns + "name") for entry in requests]
              assert len(permissions) == 2 and set(permissions) == {"android.permission.INTERNET", receiver}, permissions
              assert all(ns + "maxSdkVersion" not in entry.attrib for entry in requests)
              assert not any(entry.tag.split("}")[-1] == "permission-tree" for entry in root)
              definitions = [entry for entry in root if entry.tag.split("}")[-1] == "permission"]
              assert len(definitions) == 1 and definitions[0].tag == "permission"
              assert definitions[0].get(ns + "name") == receiver
              level = definitions[0].get(ns + "protectionLevel")
              assert level is not None
              assert level == "signature" or int(level, 0) == 2, level
              return sorted(permissions), level

          permissions, receiver_level = verify_permissions(manifest)
          def must_reject(root, reason):
              try:
                  verify_permissions(root)
              except (AssertionError, ValueError):
                  return
              raise AssertionError("unsafe permission fixture accepted: " + reason)

          invalid = copy.deepcopy(manifest)
          invalid.set("package", "other.application")
          must_reject(invalid, "different package")
          invalid = copy.deepcopy(manifest)
          ET.SubElement(invalid, "uses-permission", {ns + "name": "android.permission.CAMERA"})
          must_reject(invalid, "additional permission")
          invalid = copy.deepcopy(manifest)
          ET.SubElement(invalid, "uses-permission", {ns + "name": "android.permission.INTERNET"})
          must_reject(invalid, "duplicate permission")
          invalid = copy.deepcopy(manifest)
          invalid.find("permission").set(ns + "protectionLevel", "normal")
          must_reject(invalid, "weakened protection")
          invalid = copy.deepcopy(manifest)
          invalid.find("permission").attrib.pop(ns + "protectionLevel")
          must_reject(invalid, "missing protection")
          invalid = copy.deepcopy(manifest)
          invalid.find("permission").set(ns + "protectionLevel", "0x12")
          must_reject(invalid, "extra protection flag")
          invalid = copy.deepcopy(manifest)
          ET.SubElement(invalid, "uses-permission-sdk-23", {ns + "name": "android.permission.CAMERA"})
          must_reject(invalid, "SDK-specific permission")
          invalid = copy.deepcopy(manifest)
          ET.SubElement(invalid, "permission-tree", {ns + "name": "other.namespace"})
          must_reject(invalid, "permission namespace")
          application = manifest.find("application")
          assert application is not None and application.get(ns + "debuggable", "false") == "false"
          with zipfile.ZipFile(apk) as archive:
              names = archive.namelist()
              assert "lib/arm64-v8a/libapp.so" in names
              assert {name.split("/")[1] for name in names if name.startswith("lib/") and not name.endswith("/")} == {"arm64-v8a"}
          with apk.open("rb") as stream:
              digest = hashlib.file_digest(stream, "sha256").hexdigest()
          revision = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          client_tree = subprocess.check_output(["git", "rev-parse", "HEAD:apps/client"], text=True).strip()
          print("ANDROID_RELEASE_VERIFIED " + json.dumps({
              "source_revision": revision, "client_tree": client_tree,
              "apk_sha256": digest, "apk_bytes": apk.stat().st_size,
              "registrant_sha256": hashlib.sha256(registrant.read_bytes()).hexdigest(),
              "permissions": permissions, "receiver_permission_level": receiver_level,
              "permission_negative_fixtures": 8, "target_platform": "android-arm64",
          }, sort_keys=True))
          PY
